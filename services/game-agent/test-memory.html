<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dory Memory Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1e293b;
        }

        h1 {
            font-size: 22px;
            color: #22d3ee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 .icon { font-size: 26px; }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls label { font-size: 13px; color: #94a3b8; }

        .controls input, .controls select {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .controls input:focus, .controls select:focus {
            outline: none;
            border-color: #22d3ee;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #64748b;
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.ok { background: #22c55e; }

        .btn {
            padding: 6px 14px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #1e293b;
            color: #e2e8f0;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
        }

        .btn:hover { background: #334155; border-color: #22d3ee; }
        .btn.active { background: #164e63; border-color: #22d3ee; color: #22d3ee; }

        /* ── Stats row ──────────────────────────────────────── */

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px 16px;
        }

        .stat-card .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 26px;
            font-weight: 700;
            color: #22d3ee;
        }

        .stat-card .sub {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* ── Tabs ───────────────────────────────────────────── */

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 0;
        }

        .tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }

        .tab:hover { color: #e2e8f0; }
        .tab.active { color: #22d3ee; border-bottom-color: #22d3ee; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Profile ────────────────────────────────────────── */

        .profile-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .profile-card h3 {
            font-size: 16px;
            color: #22d3ee;
            margin-bottom: 12px;
        }

        .profile-card .narrative {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .profile-section h4 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 8px;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            background: #164e63;
            color: #22d3ee;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .tag.green { background: #14532d; color: #4ade80; }
        .tag.purple { background: #3b0764; color: #c084fc; }
        .tag.orange { background: #431407; color: #fb923c; }

        /* ── Cards (memories, summaries) ────────────────────── */

        .card-list { display: flex; flex-direction: column; gap: 10px; }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px 16px;
            transition: border-color 0.15s;
        }

        .card:hover { border-color: #475569; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .card-type {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .type-episodic  { background: #1e3a5f; color: #60a5fa; }
        .type-semantic   { background: #3b0764; color: #c084fc; }
        .type-procedural { background: #14532d; color: #4ade80; }
        .type-working    { background: #431407; color: #fb923c; }
        .type-session    { background: #1e3a5f; color: #60a5fa; }
        .type-daily      { background: #14532d; color: #4ade80; }
        .type-user_profile { background: #3b0764; color: #c084fc; }

        .card-time {
            font-size: 11px;
            color: #64748b;
        }

        .card-text {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.5;
        }

        .card-meta {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .card-meta span {
            font-size: 11px;
            color: #64748b;
        }

        .importance-bar {
            display: inline-block;
            width: 60px;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            vertical-align: middle;
            margin-left: 4px;
        }

        .importance-fill {
            height: 100%;
            border-radius: 3px;
            background: #22d3ee;
        }

        /* ── Empty / Error states ───────────────────────────── */

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #475569;
        }

        .empty-state .big { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        .error-banner {
            background: #451a1a;
            border: 1px solid #7f1d1d;
            color: #fca5a5;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        /* ── System Context Tab ─────────────────────────────── */

        .context-block {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 600px;
            overflow-y: auto;
        }

        /* ── Pagination ─────────────────────────────────────── */

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }

        .pagination span { font-size: 13px; color: #94a3b8; }
    </style>
</head>
<body>
    <header>
        <h1><span class="icon">🧠</span> Dory Memory Dashboard</h1>
        <div class="controls">
            <label>User ID:</label>
            <input type="text" id="userId" value="Dory" style="width: 100px;">
            <label>API:</label>
            <input type="text" id="apiBase" value="http://localhost:3000" style="width: 180px;">
            <button class="btn" id="refreshBtn" onclick="refresh()">Refresh</button>
            <button class="btn" id="autoBtn" onclick="toggleAuto()">Auto: OFF</button>
            <div class="status-bar">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>
    </header>

    <div class="error-banner" id="errorBanner"></div>

    <!-- Stats -->
    <div class="stats-row" id="statsRow">
        <div class="stat-card">
            <div class="label">Total Memories</div>
            <div class="value" id="statTotal">-</div>
            <div class="sub" id="statBreakdown"></div>
        </div>
        <div class="stat-card">
            <div class="label">Episodic</div>
            <div class="value" id="statEpisodic">-</div>
            <div class="sub">Events &amp; experiences</div>
        </div>
        <div class="stat-card">
            <div class="label">Semantic</div>
            <div class="value" id="statSemantic">-</div>
            <div class="sub">Preferences &amp; knowledge</div>
        </div>
        <div class="stat-card">
            <div class="label">Summaries</div>
            <div class="value" id="statSummaries">-</div>
            <div class="sub" id="statSummaryBreakdown"></div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('profile')">Profile</button>
        <button class="tab" onclick="switchTab('memories')">Memories</button>
        <button class="tab" onclick="switchTab('summaries')">Summaries</button>
        <button class="tab" onclick="switchTab('context')">System Context</button>
    </div>

    <!-- Profile tab -->
    <div class="tab-content active" id="tab-profile">
        <div id="profileContent">
            <div class="empty-state">
                <div class="big">🧠</div>
                <p>No profile yet. Play a session to build one!</p>
            </div>
        </div>
    </div>

    <!-- Memories tab -->
    <div class="tab-content" id="tab-memories">
        <div style="display:flex;gap:8px;margin-bottom:12px;">
            <select id="memTypeFilter" onchange="loadMemories()">
                <option value="">All types</option>
                <option value="episodic">Episodic</option>
                <option value="semantic">Semantic</option>
                <option value="procedural">Procedural</option>
                <option value="working">Working</option>
            </select>
            <input type="text" id="memTagFilter" placeholder="Filter tags (comma-sep)" onchange="loadMemories()" style="flex:1;background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:6px 10px;border-radius:6px;font-size:13px;">
        </div>
        <div class="card-list" id="memoriesList"></div>
        <div class="pagination" id="memoriesPagination"></div>
    </div>

    <!-- Summaries tab -->
    <div class="tab-content" id="tab-summaries">
        <div style="display:flex;gap:8px;margin-bottom:12px;">
            <select id="sumTypeFilter" onchange="loadSummaries()">
                <option value="">All types</option>
                <option value="session">Session</option>
                <option value="daily">Daily</option>
                <option value="user_profile">User Profile</option>
            </select>
        </div>
        <div class="card-list" id="summariesList"></div>
    </div>

    <!-- System Context tab -->
    <div class="tab-content" id="tab-context">
        <p style="font-size:13px;color:#64748b;margin-bottom:12px;">
            This is the full text context that gets injected into Dory's voice agent prompt.
        </p>
        <div class="context-block" id="contextBlock">Loading...</div>
    </div>

    <script>
        // ── State ──────────────────────────────────────────────
        let autoInterval = null;
        let memoryPage = 0;
        const PAGE_SIZE = 30;

        // ── Helpers ────────────────────────────────────────────
        function getBase() { return document.getElementById('apiBase').value.replace(/\/$/, ''); }
        function getUserId() { return document.getElementById('userId').value.trim() || 'Dory'; }

        async function apiFetch(path) {
            const res = await fetch(getBase() + path);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        function timeAgo(dateStr) {
            const d = new Date(dateStr);
            const sec = Math.floor((Date.now() - d.getTime()) / 1000);
            if (sec < 60) return `${sec}s ago`;
            if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
            if (sec < 86400) return `${Math.floor(sec / 3600)}h ago`;
            return `${Math.floor(sec / 86400)}d ago`;
        }

        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function setStatus(ok, text) {
            document.getElementById('statusDot').className = 'status-dot' + (ok ? ' ok' : '');
            document.getElementById('statusText').textContent = text;
        }

        function showError(msg) {
            const el = document.getElementById('errorBanner');
            if (msg) { el.textContent = msg; el.style.display = 'block'; }
            else { el.style.display = 'none'; }
        }

        // ── Tabs ───────────────────────────────────────────────
        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add('active');

            // Lazy-load content for the tab
            if (name === 'memories') loadMemories();
            if (name === 'summaries') loadSummaries();
            if (name === 'context') loadContext();
        }

        // ── Stats ──────────────────────────────────────────────
        async function loadStats() {
            try {
                const data = await apiFetch(`/api/memory/stats/${getUserId()}`);
                document.getElementById('statTotal').textContent = data.totalMemories;
                document.getElementById('statEpisodic').textContent = data.byType.episodic || 0;
                document.getElementById('statSemantic').textContent = data.byType.semantic || 0;
                document.getElementById('statSummaries').textContent = data.totalSummaries;

                const breakdown = Object.entries(data.byType)
                    .filter(([k]) => k !== 'episodic' && k !== 'semantic')
                    .map(([k, v]) => `${k}: ${v}`)
                    .join(', ');
                document.getElementById('statBreakdown').textContent = breakdown || '';

                const sumBreakdown = Object.entries(data.bySummaryType)
                    .map(([k, v]) => `${k}: ${v}`)
                    .join(', ');
                document.getElementById('statSummaryBreakdown').textContent = sumBreakdown || '';

                setStatus(true, `Updated ${new Date().toLocaleTimeString()}`);
                showError(null);
            } catch (e) {
                setStatus(false, 'Error');
                showError(`Cannot reach game agent at ${getBase()} — is it running? (${e.message})`);
            }
        }

        // ── Profile ────────────────────────────────────────────
        async function loadProfile() {
            const container = document.getElementById('profileContent');
            try {
                const data = await apiFetch(`/api/memory/profile/${getUserId()}`);
                if (!data.profile) {
                    container.innerHTML = `<div class="empty-state"><div class="big">🧠</div><p>No profile yet. Play a session to build one!</p></div>`;
                    return;
                }

                const p = data.profile;
                const c = p.content || {};
                let html = '<div class="profile-card">';
                html += '<h3>Player Profile</h3>';

                if (c.narrative) {
                    html += `<div class="narrative">${escHtml(c.narrative)}</div>`;
                }

                html += '<div class="profile-grid">';

                // Personality
                if (c.personality) {
                    html += '<div class="profile-section"><h4>Personality</h4><div class="tag-list">';
                    (c.personality.traits || []).forEach(t => {
                        html += `<span class="tag">${escHtml(t)}</span>`;
                    });
                    if (c.personality.playStyle) html += `<span class="tag green">${escHtml(c.personality.playStyle)}</span>`;
                    if (c.personality.communicationStyle) html += `<span class="tag purple">${escHtml(c.personality.communicationStyle)}</span>`;
                    html += '</div></div>';
                }

                // Preferences
                if (c.preferences && Object.keys(c.preferences).length > 0) {
                    html += '<div class="profile-section"><h4>Preferences</h4><div class="tag-list">';
                    Object.entries(c.preferences).forEach(([k, v]) => {
                        const val = typeof v === 'string' ? v : Array.isArray(v) ? v.join(', ') : JSON.stringify(v);
                        html += `<span class="tag orange">${escHtml(k)}: ${escHtml(val)}</span>`;
                    });
                    html += '</div></div>';
                }

                // Goals
                if (c.goals && c.goals.length > 0) {
                    html += '<div class="profile-section"><h4>Goals</h4><div class="tag-list">';
                    c.goals.forEach(g => {
                        const cls = g.status === 'completed' ? 'green' : g.status === 'abandoned' ? '' : 'purple';
                        html += `<span class="tag ${cls}">${escHtml(g.status)}: ${escHtml(g.description)}</span>`;
                    });
                    html += '</div></div>';
                }

                // Stats
                if (c.statistics) {
                    html += '<div class="profile-section"><h4>Lifetime Stats</h4><div class="tag-list">';
                    const s = c.statistics;
                    if (s.tasksCompleted) html += `<span class="tag green">Tasks: ${s.tasksCompleted}</span>`;
                    if (s.deaths) html += `<span class="tag">Deaths: ${s.deaths}</span>`;
                    if (s.structuresBuilt) html += `<span class="tag">Built: ${s.structuresBuilt}</span>`;
                    if (s.sessionsPlayed) html += `<span class="tag">Sessions: ${s.sessionsPlayed}</span>`;
                    if (s.resourcesCollected) {
                        Object.entries(s.resourcesCollected).forEach(([r, n]) => {
                            html += `<span class="tag orange">${escHtml(r)}: ${n}</span>`;
                        });
                    }
                    html += '</div></div>';
                }

                html += '</div>'; // profile-grid
                html += `<div style="margin-top:16px;font-size:11px;color:#475569;">
                    Last updated: ${new Date(p.lastUpdated).toLocaleString()} &middot; 
                    Version ${p.version} &middot; 
                    Based on ${p.sourceMemoryCount} memories
                </div>`;
                html += '</div>'; // profile-card

                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p>Error loading profile: ${escHtml(e.message)}</p></div>`;
            }
        }

        // ── Memories ───────────────────────────────────────────
        async function loadMemories() {
            const container = document.getElementById('memoriesList');
            const pagination = document.getElementById('memoriesPagination');
            const type = document.getElementById('memTypeFilter').value;
            const tags = document.getElementById('memTagFilter').value.trim();

            let path = `/api/memory/memories?userId=${getUserId()}&limit=${PAGE_SIZE}&skip=${memoryPage * PAGE_SIZE}`;
            if (type) path += `&type=${type}`;
            if (tags) path += `&tags=${encodeURIComponent(tags)}`;

            try {
                const data = await apiFetch(path);
                if (data.memories.length === 0) {
                    container.innerHTML = `<div class="empty-state"><div class="big">📭</div><p>No memories found.</p></div>`;
                    pagination.innerHTML = '';
                    return;
                }

                container.innerHTML = data.memories.map(m => {
                    const importance = Math.round((m.importance || 0) * 100);
                    const tagsHtml = (m.tags || []).slice(0, 6).map(t =>
                        `<span class="tag" style="font-size:10px;padding:1px 6px;">${escHtml(t)}</span>`
                    ).join('');

                    return `<div class="card">
                        <div class="card-header">
                            <span class="card-type type-${m.type}">${m.type}</span>
                            <span class="card-time">${timeAgo(m.timestamp)}</span>
                        </div>
                        <div class="card-text">${escHtml(m.textContent || '(no text)')}</div>
                        <div class="card-meta">
                            <span>Importance: ${importance}%
                                <span class="importance-bar"><span class="importance-fill" style="width:${importance}%"></span></span>
                            </span>
                            <span>Source: ${m.source || '?'}</span>
                            <span>Session: ${(m.sessionId || '').substring(0, 8)}...</span>
                        </div>
                        ${tagsHtml ? `<div style="margin-top:6px;">${tagsHtml}</div>` : ''}
                    </div>`;
                }).join('');

                // Pagination
                const hasPrev = memoryPage > 0;
                const hasNext = data.memories.length === PAGE_SIZE;
                pagination.innerHTML = `
                    <button class="btn" onclick="memoryPage--;loadMemories()" ${hasPrev ? '' : 'disabled'}>Prev</button>
                    <span>Page ${memoryPage + 1}</span>
                    <button class="btn" onclick="memoryPage++;loadMemories()" ${hasNext ? '' : 'disabled'}>Next</button>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p>Error: ${escHtml(e.message)}</p></div>`;
            }
        }

        // ── Summaries ──────────────────────────────────────────
        async function loadSummaries() {
            const container = document.getElementById('summariesList');
            const type = document.getElementById('sumTypeFilter').value;
            let path = `/api/memory/summaries?userId=${getUserId()}&limit=20`;
            if (type) path += `&type=${type}`;

            try {
                const data = await apiFetch(path);
                if (data.summaries.length === 0) {
                    container.innerHTML = `<div class="empty-state"><div class="big">📋</div><p>No summaries yet.</p></div>`;
                    return;
                }

                container.innerHTML = data.summaries.map(s => {
                    const c = s.content || {};
                    let detailsHtml = '';

                    // Key events
                    if (c.keyEvents && c.keyEvents.length > 0) {
                        detailsHtml += '<div style="margin-top:8px;"><strong style="font-size:11px;color:#64748b;">KEY EVENTS:</strong><ul style="margin:4px 0 0 16px;font-size:12px;color:#94a3b8;">';
                        c.keyEvents.slice(0, 5).forEach(e => {
                            detailsHtml += `<li>${escHtml(e.description)}</li>`;
                        });
                        detailsHtml += '</ul></div>';
                    }

                    // Achievements
                    if (c.achievements && c.achievements.length > 0) {
                        detailsHtml += '<div style="margin-top:6px;"><strong style="font-size:11px;color:#64748b;">ACHIEVEMENTS:</strong><div class="tag-list" style="margin-top:4px;">';
                        c.achievements.forEach(a => {
                            detailsHtml += `<span class="tag green" style="font-size:10px;padding:2px 8px;">${escHtml(a.description)}</span>`;
                        });
                        detailsHtml += '</div></div>';
                    }

                    // Statistics
                    if (c.statistics) {
                        const stats = [];
                        if (c.statistics.tasksCompleted) stats.push(`Tasks: ${c.statistics.tasksCompleted}`);
                        if (c.statistics.deaths) stats.push(`Deaths: ${c.statistics.deaths}`);
                        if (c.statistics.structuresBuilt) stats.push(`Built: ${c.statistics.structuresBuilt}`);
                        if (stats.length > 0) {
                            detailsHtml += `<div style="margin-top:6px;font-size:11px;color:#64748b;">${stats.join(' | ')}</div>`;
                        }
                    }

                    const periodStr = s.period
                        ? `${new Date(s.period.start).toLocaleDateString()} - ${new Date(s.period.end).toLocaleDateString()}`
                        : '';

                    return `<div class="card">
                        <div class="card-header">
                            <span class="card-type type-${s.summaryType}">${s.summaryType}</span>
                            <span class="card-time">${timeAgo(s.lastUpdated)} ${periodStr ? '&middot; ' + periodStr : ''}</span>
                        </div>
                        <div class="card-text">${escHtml(s.content?.narrative || s.textContent || '(no narrative)')}</div>
                        ${detailsHtml}
                        <div class="card-meta">
                            <span>Version ${s.version || 1}</span>
                            <span>${s.sourceMemoryCount || 0} source memories</span>
                            ${s.period?.sessionId ? `<span>Session: ${s.period.sessionId.substring(0, 8)}...</span>` : ''}
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><p>Error: ${escHtml(e.message)}</p></div>`;
            }
        }

        // ── System Context ─────────────────────────────────────
        async function loadContext() {
            const block = document.getElementById('contextBlock');
            try {
                const data = await apiFetch(`/api/memory/system-context/${getUserId()}`);
                block.textContent = data.context || '(empty)';
            } catch (e) {
                block.textContent = `Error: ${e.message}`;
            }
        }

        // ── Refresh all ────────────────────────────────────────
        async function refresh() {
            memoryPage = 0;
            await Promise.all([
                loadStats(),
                loadProfile(),
            ]);

            // Also refresh active tab
            const activeTab = document.querySelector('.tab-content.active');
            if (activeTab.id === 'tab-memories') loadMemories();
            else if (activeTab.id === 'tab-summaries') loadSummaries();
            else if (activeTab.id === 'tab-context') loadContext();
        }

        // ── Auto-refresh ──────────────────────────────────────
        function toggleAuto() {
            const btn = document.getElementById('autoBtn');
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                btn.textContent = 'Auto: OFF';
                btn.classList.remove('active');
            } else {
                autoInterval = setInterval(refresh, 5000);
                btn.textContent = 'Auto: 5s';
                btn.classList.add('active');
                refresh(); // immediate first
            }
        }

        // ── Init ───────────────────────────────────────────────
        refresh();
    </script>
</body>
</html>
